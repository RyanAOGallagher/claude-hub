<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Claude Hub</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root { color-scheme: dark; --accent: #e8b04b; --accent-grad: linear-gradient(90deg, #e8b04b, #e8b04b); }
    :root[data-harness='crush'] { --accent: #ff60ff; --accent-grad: linear-gradient(90deg, #ff60ff, #6b50ff); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111214; color: #ddd;
      height: 100vh; display: flex; overflow: hidden;
      user-select: none;
    }
    #sidebar {
      width: 210px; flex-shrink: 0;
      background: #191a1d; border-right: 1px solid #26272b;
      display: flex; flex-direction: column;
      padding-top: 40px; /* room for traffic lights */
      -webkit-app-region: drag;
    }
    #fixedrows { -webkit-app-region: no-drag; }
    #projlist { overflow-y: auto; flex: 1; -webkit-app-region: no-drag; padding: 6px 0 10px; }
    .proj {
      padding: 6px 14px; font-size: 12.5px; cursor: pointer; color: #a6a7ab;
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    .proj .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    /* always rendered (hidden, not display:none) so rows don't grow on hover */
    .proj .sh {
      visibility: hidden; font-size: 10px; color: #777;
      padding: 1px 5px; border: 1px solid #333; border-radius: 4px;
    }
    .proj:hover .sh { visibility: visible; }
    .proj .sh:hover { color: #fff; border-color: #666; }
    .proj:hover { background: #222327; color: #fff; }
    .proj.hub {
      color: var(--accent); font-weight: 600; font-size: 13px;
      padding: 8px 14px;
    }
    .proj.shellrow { color: #ddd; font-size: 12px; padding: 4px 14px; }
    .proj.harness {
      color: var(--accent); font-size: 12px; padding: 6px 14px;
      border-top: 1px solid #26272b; margin-top: 4px;
    }
    .proj.hub .name, .proj.harness .name, .pvhead {
      background: var(--accent-grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .proj .rfsh {
      visibility: hidden; display: inline-flex; align-items: center;
      color: #777; padding: 2px; border-radius: 4px; cursor: pointer;
    }
    .proj:hover .rfsh { visibility: visible; }
    .proj .rfsh:hover { color: #fff; }
    .proj .rfsh svg { stroke: currentColor; }
    .roothead {
      padding: 10px 14px 3px; font-size: 11px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; color: #666;
      display: flex; align-items: center; gap: 6px;
    }
    .roothead { cursor: pointer; user-select: none; }
    .roothead:hover .name { color: #aaa; }
    .roothead .name { flex: 1; }
    .roothead .chev { display: inline-flex; align-items: center; margin-left: -4px; transition: transform .12s; }
    .roothead .chev svg { stroke: currentColor; width: 12px; height: 12px; }
    .roothead.collapsed .chev { transform: rotate(-90deg); }
    .roothead.collapsed { padding-bottom: 6px; }
    .roothead .sh {
      visibility: hidden; font-size: 10px; color: #777; cursor: pointer;
      padding: 1px 5px; border: 1px solid #333; border-radius: 4px;
      text-transform: none; letter-spacing: 0;
    }
    .roothead:hover .sh { visibility: visible; }
    .roothead .sh:hover { color: #fff; border-color: #666; }
    #fixedrows { border-bottom: 1px solid #26272b; padding-bottom: 6px; margin-bottom: 2px; }
    /* project view (sidebar while a project tab is focused) */
    .pvhead {
      padding: 10px 14px 2px; font-size: 13px; font-weight: 600; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rootbody.brief {
      padding: 2px 14px 8px; font-size: 11.5px; line-height: 1.45; color: #9a9ba0;
      user-select: text; max-height: 45vh; overflow-y: auto;
    }
    .brief .bh { color: #cfd0d4; font-weight: 600; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 9px; }
    .brief .bp { margin-top: 3px; word-break: break-word; }
    .brief .bli { margin-top: 2px; position: relative; padding-left: 10px; word-break: break-word; }
    .brief .bli::before { content: '–'; position: absolute; left: 0; color: #555; }
    .brief b { color: #cfd0d4; font-weight: 600; }
    .brief code { font-family: Menlo, monospace; font-size: 10.5px; color: #7fa8d9; }
    .bnone { padding: 2px 14px 6px; font-size: 11.5px; color: #555; font-style: italic; }
    .tnode {
      display: flex; align-items: center; gap: 4px; padding: 2px 14px;
      font-size: 12px; color: #a6a7ab; cursor: pointer; white-space: nowrap;
    }
    .tnode:hover { background: #222327; color: #fff; }
    .tnode .name { overflow: hidden; text-overflow: ellipsis; }
    .tnode .tic { display: inline-flex; align-items: center; width: 12px; flex-shrink: 0; transition: transform .12s; }
    .tnode .tic svg { stroke: currentColor; width: 12px; height: 12px; }
    .tnode.dir { color: #c8c9cd; }
    .tnode.dir.open .tic { transform: rotate(90deg); }
    .tmore { padding: 2px 14px; font-size: 11px; color: #555; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #tabbar {
      height: 40px; flex-shrink: 0;
      display: flex; align-items: flex-end; gap: 2px;
      background: #191a1d; border-bottom: 1px solid #26272b;
      padding: 0 8px; overflow-x: auto;
      -webkit-app-region: drag;
    }
    #tabbar::-webkit-scrollbar { display: none; }
    .tab {
      -webkit-app-region: no-drag;
      padding: 8px 12px; font-size: 12px; color: #999; cursor: pointer;
      border-radius: 6px 6px 0 0; display: flex; gap: 8px; align-items: center;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab.active { background: #111214; color: #fff; }
    /* one project's tabs (claude session + its terminals) glued into one draggable unit */
    .tabgroup {
      -webkit-app-region: no-drag;
      display: flex; align-items: flex-end; gap: 2px;
      padding: 0 3px; flex-shrink: 0;
      background: #1e2024; border-radius: 8px 8px 0 0;
    }
    .tab.dragging, .tabgroup.dragging { opacity: .4; }
    .tab .tabic { display: inline-flex; align-items: center; width: 13px; height: 13px; flex-shrink: 0; }
    .tab .tabic svg { stroke: currentColor; }
    .tab .tabic img { width: 13px; height: 13px; border-radius: 3px; }
    .sessmenu {
      position: fixed; z-index: 50; min-width: 150px;
      background: #202126; border: 1px solid #333; border-radius: 8px;
      padding: 4px; box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
    }
    .smitem {
      padding: 6px 10px; font-size: 12px; color: #ccc;
      border-radius: 5px; cursor: pointer; white-space: nowrap;
    }
    .smitem:hover { background: #2c2d33; color: #fff; }
    .tab.dead { color: #666; font-style: italic; }
    .tab .x { opacity: .35; font-size: 11px; }
    .tab .x:hover { opacity: 1; }
    .tab .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: transparent; flex-shrink: 0;
    }
    .tab .dot.working { background: #8a8b90; animation: pulse 1.4s ease-in-out infinite; }
    .tab .dot.attention { background: #ff9f43; box-shadow: 0 0 6px #ff9f43aa; }
    .tab .dot.done { background: #2ecc71; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    #terms { flex: 1; position: relative; min-height: 0; }
    .term-holder { position: absolute; display: none; }
    /* padding must live on .xterm, not the holder — the fit addon only subtracts
       the terminal element's own padding, so holder padding causes clipped rows */
    .xterm { height: 100%; padding: 8px 4px 8px 10px; }
    .browser-holder { position: absolute; display: none; flex-direction: column; }
    .holder-focused { outline: 1px solid #3a3b40; outline-offset: -1px; }
    #divider { position: absolute; z-index: 5; display: none; background: transparent; }
    #divider:hover, #divider:active { background: #3a3b40; }
    #divider.row { cursor: col-resize; width: 7px; margin-left: -3px; height: 100%; }
    #divider.col { cursor: row-resize; height: 7px; margin-top: -3px; width: 100%; }
    .splitbtns {
      -webkit-app-region: no-drag;
      margin-left: auto; align-self: center;
      display: flex; gap: 2px; padding-right: 8px;
    }
    .sbtn { color: #777; font-size: 13px; cursor: pointer; padding: 3px 6px; border-radius: 4px; }
    .sbtn:hover { background: #222327; color: #fff; }
    .sbtn.on { color: var(--accent); }
    .btoolbar {
      height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      padding: 0 10px; border-bottom: 1px solid #26272b;
    }
    .bbtn {
      background: none; border: none; color: #999; font-size: 15px; cursor: pointer;
      padding: 2px 6px; border-radius: 4px;
    }
    .bbtn:hover { background: #222327; color: #fff; }
    .urlbar {
      flex: 1; background: #191a1d; border: 1px solid #2e2f34; border-radius: 6px;
      color: #ddd; font-size: 12.5px; padding: 5px 10px; outline: none;
    }
    .urlbar:focus { border-color: #555; }
    webview { flex: 1; background: #fff; }
    .startpanel {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    .sp-head { color: #888; font-size: 13px; margin-bottom: 6px; }
    .sp-hint { color: #555; font-size: 12px; }
    .portbtn {
      background: #191a1d; border: 1px solid #2e2f34; border-radius: 8px;
      color: #7fa8d9; font-size: 14px; font-family: Menlo, monospace;
      padding: 10px 26px; cursor: pointer; min-width: 220px;
    }
    .portbtn:hover { border-color: #7fa8d9; color: #fff; }
    .bmbtn { font-family: inherit; color: #a6a7ab; }
    .bmbtn:hover { border-color: #777; }
    .spsec { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .proj .ic { display: inline-flex; align-items: center; }
    .proj .ic svg { stroke: currentColor; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="fixedrows"></div>
    <div id="projlist"></div>
  </div>
  <div id="main">
    <div id="tabbar"></div>
    <div id="terms"><div id="divider"></div></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
